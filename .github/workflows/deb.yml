name: build-deb

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dh-python python3-setuptools python3-setuptools-gettext

      - name: Build .deb (dpkg-buildpackage)
        run: dpkg-buildpackage -b -us -uc

      - name: Collect artifacts
        run: |
          mkdir -p dist
          mv ../variety_*.deb dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: variety-deb
          path: dist/

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.deb --generate-notes 2>/dev/null || \
          gh release upload "${GITHUB_REF_NAME}" dist/*.deb --clobber